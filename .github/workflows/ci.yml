name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Unit and integration tests (Testcontainers)
        run: ./mvnw -B verify

      - name: Claude Code hook tests
        run: node --test ".claude/hooks/*.test.mjs"
